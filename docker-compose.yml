services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./server
    env_file:
      - ./server/.env.example
    ports:
      - "4000:4000"
    depends_on:
      - mongodb

  web:
    build:
      context: ./client
    environment:
      - VITE_API_URL=http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
